name: Release
on:
  push:
    tags: ["v*"]
jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Builds PlateIntel-<tag>.zip from .pkgmeta and attaches it to the GitHub release.
      - uses: BigWigsMods/packager@v2
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
